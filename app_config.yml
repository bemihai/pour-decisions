chroma:
  client:
    host: ${oc.env:CHROMA_HOST, localhost}               # ChromaDB server host (env var or default)
    port: ${oc.env:CHROMA_PORT, 8100}               # ChromaDB server port (env var or default; host-mapped to 8100)
  chunking:
    strategy: by_title                  # basic, by_title, semantic
    chunk_size: 1024
    chunk_overlap: 256
    extract_wine_metadata: true         # extract grape, region, vintage from chunks
    # Small-to-big retrieval settings
    enable_small_to_big: false          # use small chunks for retrieval, larger for context
    small_chunk_size: 256               # size of small chunks for embedding
    large_chunk_size: 1024              # size of larger context chunks
  retrieval:
    n_results: 5                        # number of chunks to retrieve per query
    similarity_threshold: 0.3           # minimum similarity score (0.0-1.0) to filter results
    # Deduplication settings
    use_deduplication: true             # enable semantic deduplication of retrieved chunks
    deduplication_threshold: 0.9        # similarity threshold for removing duplicate chunks
    # Hybrid search settings
    enable_hybrid: true                 # enable hybrid search (vector + BM25)
    hybrid_vector_weight: 0.7           # weight for vector search in hybrid mode
    hybrid_keyword_weight: 0.3          # weight for BM25 keyword search
    bm25_index_path: "chroma-data/bm25_index.pkl"  # path to BM25 index file
    # Reranking settings
    enable_reranking: true              # enable cross-encoder reranking
    reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"  # reranker model
    rerank_top_k: 5                     # number of results after reranking
    # Context compression settings (reduces token usage)
    enable_compression: false           # enable context compression before LLM
    compression_max_chars: 8000         # max context size (~2000 tokens)
    # Metadata boosting (uses wine entity extraction)
    enable_metadata_boost: true         # boost results matching query entities
    metadata_boost_factor: 0.1          # score boost per matching entity
  settings:
    batch_size: 2500
    embedder: ${oc.env:EMBEDDING_MODEL} # embedding agents for retrieval
  collections:
    - name: wine_books                  # primary collection name to query
      local_data_path: ${oc.env:WINE_BOOKS_PATH}
      metadata:
        description: "Professional wine books collection"
        hnsw:space: cosine              # similarity measure (cosine, l2, ip)
        hnsw:search_ef: 100             # num candidates for searching
        hnsw:construction_ef: 200       # increased for better indexing
        hnsw:num_threads: 8             # num of threads for indexing
        version: v1.1

model:
  provider: google                      # LLM provider (google, openai)
  name: gemini-2.5-flash                # agents name

cellar:
  db_path: cellar-data/wine_cellar.db        # path to SQLite database for wine cellar

web_search:
  provider: tavily                      # tavily only for now, can be extended to others
  max_results: 5                        # default results per search
  cache:
    enabled: true
    max_entries: 1000                   # max cached queries (LRU eviction beyond this)
    db_path: cellar-data/web_cache.db   # separate SQLite cache, independent of wine_cellar.db
  tavily:
    api_key_env: TAVILY_API_KEY         # name of the env var holding the Tavily API key

observability:
  enabled: ${oc.env:OBSERVABILITY_ENABLED, false}
  provider: ${oc.env:OBSERVABILITY_PROVIDER, phoenix}
  sampling_rate: 1.0
  service_name: pour-decisions-api
  redact_inputs: true
  redact_outputs: false
  phoenix:
    endpoint: ${oc.env:PHOENIX_ENDPOINT, http://localhost:6006/v1/traces}
    endpoint_docker: ${oc.env:PHOENIX_ENDPOINT_DOCKER, http://phoenix:6006/v1/traces}
    project_name: pour-decisions
    capture_tool_io: true
