chroma:
  client:
    host: ${oc.env:CHROMA_HOST, localhost}               # ChromaDB server host (env var or default)
    port: ${oc.env:CHROMA_PORT, 8100}               # ChromaDB server port (env var or default; host-mapped to 8100)
  extraction:
    pdf_provider: pdfplumber            # only reviewed PDF provider in M3
    epub_provider: ebooklib             # only reviewed EPUB provider in M3
    fail_on_unsupported_file: false
    strip_repeated_headers: true
    strip_repeated_footers: true
  chunking:
    strategy: section_recursive         # section_recursive, section_semantic
    chunk_size: 1024
    chunk_overlap: 256
    min_chunk_chars: 200
    preserve_section_boundaries: true
    extract_wine_metadata: true         # extract grape, region, vintage from chunks
    semantic:
      enabled: false                    # use local embedding-based chunking inside sections
      breakpoint_threshold_type: percentile
      breakpoint_threshold_amount: 95.0
    # Small-to-big retrieval settings
    enable_small_to_big: false          # use small chunks for retrieval, larger for context
    small_chunk_size: 256               # size of small chunks for embedding
    large_chunk_size: 1024              # size of larger context chunks
  indexing:
    quality_filter:
      mode: enforce                      # reject confident structural noise before embedding
      min_score: 0.4                     # ambiguous candidates below this score are excluded
    bm25:
      rebuild_on_reindex: true          # rebuild BM25 only after a successful forced Chroma reindex
      sync_manifest_path: "chroma-data/bm25_index.meta.json"  # Chroma/BM25 synchronization proof
  retrieval:
    n_results: 5                        # number of chunks to retrieve per query
    similarity_threshold: 0.3           # minimum similarity score (0.0-1.0) to filter results
    # Deduplication settings
    use_deduplication: true             # enable semantic deduplication of retrieved chunks
    deduplication_threshold: 0.9        # similarity threshold for removing duplicate chunks
    # Hybrid search settings
    enable_hybrid: true                 # enable hybrid search (vector + BM25)
    semantic_candidate_pool: 25         # complete dense pool admitted to candidate union
    bm25_candidate_pool: 25             # complete sparse pool admitted to candidate union
    reranker_input_limit: 50            # maximum unique union candidates sent to reranking
    bm25_index_path: "chroma-data/bm25_index.pkl"  # path to BM25 index file
    validate_bm25_sync: true            # stale/missing manifest disables hybrid retrieval explicitly
    # Reranking settings
    enable_reranking: true              # enable cross-encoder reranking
    reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"  # reranker model
    rerank_top_k: 5                     # number of results after reranking
    rerank_threshold: 0.0               # accepted M3 cutoff; filters negative reranker logits
    min_retrieval_confidence: 0.3       # provisional; fallback remains disabled pending failure cohort
    # Context compression settings (reduces token usage)
    enable_compression: false           # enable context compression before LLM
    compression_max_chars: 8000         # max context size (~2000 tokens)
    # Metadata boosting (uses wine entity extraction)
    enable_metadata_boost: true         # boost results matching query entities
    metadata_boost_factor: 0.1          # score boost per matching entity
  settings:
    batch_size: 2500
    embedder: ${oc.env:EMBEDDING_MODEL} # embedding agents for retrieval
  collections:
    - name: wine_books                  # primary collection name to query
      local_data_path: ${oc.env:WINE_BOOKS_PATH}
      metadata:
        description: "Professional wine books collection"
        hnsw:space: cosine              # similarity measure (cosine, l2, ip)
        hnsw:search_ef: 100             # num candidates for searching
        hnsw:construction_ef: 200       # increased for better indexing
        hnsw:num_threads: 8             # num of threads for indexing
        version: v1.1

agents:
  guardrails:
    call_budget:
      enabled: true
      max_llm_calls_per_query: 5
      max_graph_steps_per_query: 30
    loop_detection:
      enabled: true
  tool_registry:
    health_check_ttl_seconds: 60   # dependency readiness cache TTL

model:
  provider: google                      # main app production default is Google cloud
  name: gemini-2.5-flash                # main app production default model
  fallback_provider: google             # kept for compatibility when a local request falls back to cloud
  fallback_name: gemini-2.5-flash       # fallback cloud model
  hybrid_tool_calling: false            # unused while the production app defaults to cloud
  ollama:
    name: ${oc.env:OLLAMA_MODEL, gemma3:4b}  # optional local model for eval/development and explicit local startup
    base_url: ${oc.env:OLLAMA_BASE_URL, http://localhost:11434}  # used only when local startup is enabled explicitly
api:
  enable_local_model_startup: false     # production stays cloud-first by default; enable only for deliberate local startup
cellar:
  db_path: cellar-data/wine_cellar.db        # path to SQLite database for wine cellar

description_generation:
  use_cloud_model: true         # prefer cloud (Gemini) for structured output; local CPU is ~93s per call
  enable_web_search: true       # global switch for DescriptionService web snippets
  max_context_chunks: 3         # max RAG chunks injected into the description prompt
  min_relevance_score: 0.5     # minimum similarity score to accept a RAG chunk

web_search:
  provider: tavily                      # tavily only for now, can be extended to others
  max_results: 7                        # default results per search
  auto_fallback: false                  # opt in after Phase 5 checkpoint; external calls add cost and latency
  cache:
    enabled: true
    max_entries: 1000                   # max cached queries (LRU eviction beyond this)
    db_path: cellar-data/web_cache.db   # separate SQLite cache, independent of wine_cellar.db
  tavily:
    api_key_env: TAVILY_API_KEY         # name of the env var holding the Tavily API key

eval:
  dataset_path: src/eval/wine_qa_golden.jsonl
  results_dir: eval-results
  default_mode: retrieval            # retrieval or full
  default_backend: rag               # rag or agent
  execution_provider: ollama         # eval execution uses the Ollama API
  execution_model: gemma4:cloud      # cloud-hosted model under test for eval runs
  ollama:
    base_url: ${oc.env:EVAL_OLLAMA_BASE_URL, http://localhost:11434}
  max_concurrency: 1                 # parallel queries during eval
  sample_timeout_seconds: 300        # per-sample timeout; set 0 to disable
  validate_tag_filters: true         # fail fast on unknown tag filters; set false to allow exploratory tags
  ragas:
    evaluator_provider: ollama       # eval judge uses the Ollama API
    evaluator_model: gemma4:31b-cloud # low-usage cloud judge selected for Ragas reliability
    temperature: 0.0                 # deterministic structured scoring
    reasoning: false                 # disable costly thinking for structured judge prompts
    num_predict: 2048                # cap judge output to prevent runaway generations
    timeout_seconds: 120             # allow cloud judge calls to finish while bounding failures
    max_retries: 1                   # avoid repeated paid calls after a judge failure
    max_workers: 1                   # serialize judge jobs to avoid Ollama Cloud 429 responses
    metrics:
      - faithfulness
      - answer_relevancy
      - context_precision
      - context_recall
  retrieval_metrics:
    k_values: [3, 5]                 # k for precision@k
  skip_cellar_samples_if_empty: true # skip cellar category if cellar DB has no wines

observability:
  enabled: ${oc.env:OBSERVABILITY_ENABLED, false}
  provider: ${oc.env:OBSERVABILITY_PROVIDER, phoenix}
  sampling_rate: 1.0
  service_name: pour-decisions-api
  redact_inputs: true
  redact_outputs: false
  phoenix:
    endpoint: ${oc.env:PHOENIX_ENDPOINT, http://localhost:6006/v1/traces}
    endpoint_docker: ${oc.env:PHOENIX_ENDPOINT_DOCKER, http://phoenix:6006/v1/traces}
    project_name: pour-decisions
    capture_tool_io: true
