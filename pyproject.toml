[project]
name = "pour-decisions"
version = "0.6.0"
description = "Wine knowledge chatbot, cellar management, and taste profile analysis using LLMs."
readme = "README.md"
authors = [{ name = "Mihai Berbec", email = "berbec.mihaita@gmail.com" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "cellartracker>=1.1.1",
    "chromadb>=1.3.7",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "instructor>=1.13.0",
    "langchain>=1.2.0",
    "langchain-core>=1.2.2",
    "langchain-experimental>=0.4.1",
    "langchain-google-genai>=4.1.1",
    "langchain-huggingface>=1.2.0",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.5",
    "omegaconf>=2.3.0",
    "plotly>=6.5.0",
    "ragas>=0.2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.2.0",
    "torch==2.2.2; sys_platform == 'darwin'",
    "unstructured[all-docs,pdf]>=0.17.2",
    "uvicorn[standard]>=0.34.0",
    "tavily-python>=0.7.23",
    "langchain-ollama>=1.0.1",
    "arize-phoenix-otel>=0.16.0",
    "openinference-instrumentation-langchain>=0.1.63",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
    "langchain-ollama>=1.0.1",
]

[dependency-groups]
chroma = [
    "chromadb>=1.3.7",
    "dotenv>=0.9.9",
    "instructor>=1.13.0",
    "langchain-huggingface>=1.2.0",
    "numpy<2",
    "sentence-transformers>=5.2.0",
    "torch==2.2.2",
    "tqdm>=4.67.1",
    "unstructured[all-docs,pdf]>=0.18.21",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-watch>=4.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "eval: marks evaluation tests (requires GOOGLE_API_KEY and ChromaDB running)",
]
asyncio_mode = "auto"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

