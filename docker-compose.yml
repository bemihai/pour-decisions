name: pour-decisions

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pour_decisions_api
    ports:
      - "8000:8000"
    volumes:
      - ./cellar-data:/app/cellar-data
      - ./chroma-data:/app/chroma-data
      - ./app_config.yml:/app/app_config.yml
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONPATH=/app
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pour_decisions_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - API_URL=http://api:8000/api
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  chromadb:
    image: chromadb/chroma:latest
    container_name: pour_decisions_chromadb
    volumes:
      - ./chroma-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=False
      - ALLOW_RESET=True
    ports:
      - "8100:8000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama service provides local LLM inference.
  # The model is pulled automatically by the ollama-init service on first startup.
  # Default model: gemma3:4b (3.3GB RAM, fast, good quality).
  # Change OLLAMA_MODEL in .env to use a different model (see app_config.yml for options).
  # RAM limit: 3GB (sufficient for small models; increase for larger models).
  ollama:
    image: ollama/ollama:latest
    container_name: pour_decisions_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-3G}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    container_name: pour_decisions_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gemma3:4b}"]
    restart: "no"

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: pour_decisions_phoenix
    ports:
      - "6006:6006"
    environment:
      - PHOENIX_PORT=6006
    volumes:
      - phoenix-data:/phoenix
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:6006/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ollama-data:
  phoenix-data:
    driver: local
