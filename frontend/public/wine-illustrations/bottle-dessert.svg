<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 120" fill="none" aria-label="Dessert wine bottle">
  <!-- Half-bottle (375ml) shape — shorter body, same neck -->
  <!-- Capsule -->
  <rect x="18" y="4" width="12" height="8" rx="3" fill="#8a5020"/>
  <!-- Neck -->
  <rect x="20" y="12" width="8" height="20" rx="2" fill="#DDA15E"/>
  <!-- Shoulder -->
  <path d="M20 32 C20 32 15 37 15 42 L33 42 C33 37 28 32 28 32 Z" fill="#DDA15E"/>
  <!-- Body — shorter to suggest half-bottle -->
  <rect x="15" y="42" width="18" height="56" rx="3" fill="#DDA15E"/>
  <!-- Label band -->
  <rect x="15" y="54" width="18" height="26" rx="2" fill="#FAF8F5" opacity="0.88"/>
  <!-- Label lines -->
  <rect x="18" y="59" width="12" height="2" rx="1" fill="#8a5020" opacity="0.5"/>
  <rect x="19" y="64" width="10" height="1.5" rx="0.75" fill="#8a5020" opacity="0.35"/>
  <rect x="19" y="68" width="10" height="1.5" rx="0.75" fill="#8a5020" opacity="0.35"/>
  <rect x="19" y="72" width="8" height="1.5" rx="0.75" fill="#8a5020" opacity="0.35"/>
  <!-- Base -->
  <rect x="15" y="98" width="18" height="4" rx="2" fill="#8a5020"/>
  <!-- Cork -->
  <rect x="21" y="2" width="6" height="5" rx="1.5" fill="#E8D5B7"/>
</svg>

