<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 120" fill="none" aria-label="Sparkling wine bottle">
  <!-- Capsule / muselet cage hint -->
  <rect x="17" y="3" width="14" height="11" rx="3" fill="#3a5a7a"/>
  <!-- Wire cage suggestion -->
  <rect x="17" y="10" width="14" height="2" fill="#2a4a6a" opacity="0.5"/>
  <!-- Neck — thicker than still wine -->
  <rect x="19" y="14" width="10" height="18" rx="2" fill="#4A7090"/>
  <!-- Shoulder — Champagne style (high shoulder) -->
  <path d="M19 32 C19 32 12 37 12 42 L36 42 C36 37 29 32 29 32 Z" fill="#4A7090"/>
  <!-- Body — wider than Bordeaux -->
  <rect x="12" y="42" width="24" height="66" rx="3" fill="#4A7090"/>
  <!-- Label band -->
  <rect x="12" y="55" width="24" height="32" rx="2" fill="#FAF8F5" opacity="0.90"/>
  <!-- Label lines -->
  <rect x="16" y="61" width="16" height="2" rx="1" fill="#3a5a7a" opacity="0.5"/>
  <rect x="17" y="66" width="14" height="1.5" rx="0.75" fill="#3a5a7a" opacity="0.35"/>
  <rect x="17" y="70" width="14" height="1.5" rx="0.75" fill="#3a5a7a" opacity="0.35"/>
  <rect x="17" y="74" width="12" height="1.5" rx="0.75" fill="#3a5a7a" opacity="0.35"/>
  <!-- Base — punt (deeper) -->
  <rect x="12" y="108" width="24" height="4" rx="2" fill="#2a4a6a"/>
  <!-- Mushroom cork -->
  <rect x="20" y="1" width="8" height="6" rx="3" fill="#E8D5B7"/>
</svg>

